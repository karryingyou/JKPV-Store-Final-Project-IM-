<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - JKPV Store</title>
    
    <!-- BOOTSTRAP & FONT AWESOME CDNs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f6f9; }
    </style>
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}"><i class="fas fa-store me-2 text-primary"></i>JKPV Store</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="nav-link" href="{% url 'inventory' %}">Inventory</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="mb-0 fw-bold text-primary">➕ Add New Product</h3>
                <a href="{% url 'inventory' %}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Back to Inventory</a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <!-- Django Form -->
                    <form method="POST">
                        {% csrf_token %}
                        
                        <!-- Form fields rendered by Django -->
                        {{ form.as_p }}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success btn-lg fw-bold shadow-sm">
                                <i class="fas fa-save me-2"></i>Save Product
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- BOOTSTRAP JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
