{% extends 'POS/base.html' %}

{% block title %}Add Product | JKPV Store{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-primary text-white py-3 rounded-top-4">
                <h4 class="mb-0 fw-bold"><i class="fas fa-plus-circle me-2"></i>Add New Product</h4>
            </div>
            <div class="card-body p-4">
                <form action="{% url 'add_product' %}" method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Product Name</label>
                        <input type="text" name="name" class="form-control form-control-lg" placeholder="e.g. Lucky Me Instant Noodle" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Category</label>
                        <input type="text" name="category_name" class="form-control" list="category-list" placeholder="Type or select category..." autocomplete="off">
                        <datalist id="category-list">
                            {% for cat in categories %}
                                <option value="{{ cat.name }}">
                            {% endfor %}
                        </datalist>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label fw-bold">Price (₱)</label>
                            <input type="number" step="0.01" name="price" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">Stock Quantity</label>
                            <input type="number" name="stock_quantity" class="form-control" placeholder="0" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Supplier</label>
                        <input type="text" name="supplier_name" class="form-control" list="supplier-list" placeholder="Type or select supplier..." autocomplete="off">
                        <datalist id="supplier-list">
                            {% for sup in suppliers %}
                                <option value="{{ sup.name }}">
                            {% endfor %}
                        </datalist>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{% url 'inventory' %}" class="btn btn-secondary px-4 fw-bold">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold"><i class="fas fa-save me-1"></i> Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
